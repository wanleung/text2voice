[project]
name = "text2voice"
version = "0.1.0"
description = "Text-to-speech web service (English + Cantonese) built on CosyVoice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1+rocm7.13.0a20260513",
    "torchaudio==2.9.0+rocm7.13.0a20260513",
    "triton==3.5.1+rocm7.13.0a20260513",
    "rocm[libraries]==7.13.0a20260513",
    "rocm-sdk-core==7.13.0a20260513",
    "rocm-sdk-libraries-gfx1151==7.13.0a20260513",
    # CosyVoice inference dependencies (subset of upstream requirements.txt)
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "einops",
    "setuptools<81",
    "pyarrow",
    "pyworld",
    "gdown",
    "wget",
    "matplotlib",
    "hydra-core==1.3.2",
    "HyperPyYAML==1.2.3",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning",
    "modelscope",
    "omegaconf==2.3.0",
    "onnxruntime",
    "openai-whisper==20250625",
    "regex",
    "rich",
    "soundfile",
    "tiktoken",
    "transformers==4.51.3",
    "wetext==0.0.4",
    "x-transformers==2.11.24",
    # service
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-multipart",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
torch = { index = "rocm-gfx1151" }
torchaudio = { index = "rocm-gfx1151" }
triton = { index = "rocm-gfx1151" }
rocm = { index = "rocm-gfx1151" }
rocm-sdk-core = { index = "rocm-gfx1151" }
rocm-sdk-libraries-gfx1151 = { index = "rocm-gfx1151" }

[[tool.uv.index]]
name = "rocm-gfx1151"
url = "https://rocm.nightlies.amd.com/v2/gfx1151/"
explicit = true

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
